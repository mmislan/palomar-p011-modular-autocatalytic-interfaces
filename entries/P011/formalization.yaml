  "fidelity": {
    "divergences": "MAF is used only in attained form: IsMAF a means feasibility at a and a ≥ every feasible threshold; attainment (manuscript Prop. 3.6) is a hypothesis, not derived, and no supremum is formalized. Theorem 3.5 is selected only as strict-increase / strict-synergy equivalences; the manuscript's pointwise price-cone identities and the non-strict inequalities α ≤ β and max a b ≤ c are not selected. reactionEdit requires only the added input column to be nonnegative; the added output column is arbitrary. scalarNoncompositionality is stated for four explicitly written feasibility predicates, not for instances of the Network structure and Network.parallel; the 'no scalar composition rule' conclusion is an informal consequence. The abstract's criterion 'the result has no strict price at q' restates the formal right-hand sides, which are written via the original networks' price cones: N.priceCone q ∩ reactionHalfspace a b q (addition), {p ≥ 0 : Matrix.vecMul p C ∈ N.priceCone q} (aggregation, using C ≥ 0), and N₁.priceCone q ∩ N₂.priceCone q (coupling). Each equals the price cone of the resulting network by unfolding definitions; this identity is not itself a selected declaration. Child-selection autocatalyticity is rational semipositivity (∃ v ≥ 0, v ≠ 0, Mv > 0 over ℚ) of the net-stoichiometry matrix of an IndexedMatching; the real/rational bridge is not part of the selected statement. Anchor completeness (every OrdinaryCore is the support of a listed anchor) and uniqueness of each anchor matching on its vertex set are hypotheses, not derived; the manuscript cites uniqueness from the source literature. The checker is an input structure: true answers carry a rational primal certificate for some realising matching, and false answers carry a rational dual certificate for every realising matching with at least one species (a matching with no species is never autocatalytic, so it needs none). certifiedAutocatalyticTest_nonempty proves that such a checker exists for every finite network, via an exact rational Gordan alternative; the checker is defined classically and is not claimed to be an executable rational solver. Anchor completeness and anchor uniqueness remain hypotheses in general; OneSpeciesExample.sourceDirectCSCoreEnum_example proves them, together with checker existence, for the network A → 2A. Child-selection cores are minimal under matching-edge-set inclusion, whereas OrdinaryCore uses the product order on (species, reactions) supports (manuscript Example 4.3). The literature question (Golnik, Gatter, Stadler, Vassena) is informal; the entry answers it conditionally via this enumerator. Complexity and benchmark claims of manuscript Section 4 are not formalized. Problem 15 (Nandan, Nghe, Unterberger) concerns dynamical autocatalysis under arbitrary species-specific degradation; the formal statements concern only the linear diluted source matrix reactionPart rs − diag d built from unary reactions with nonnegative rates and products and an irreducible source adjacency, not nonlinear networks or mass-action kinetics. Growth/criticality/extinction are expressed through a real spectral bound (real eigenvalue dominating real parts of all complex eigenvalues of the complexified matrix), not through ODE trajectories; only the three sign cases of Thm 5.4 are selected, not the general-λ form. partialActuation is the certificate form of Thm 5.5 for an arbitrary Metzler matrix; the spectral form and the Remark 5.8 extensions are not selected."
